services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicekci
      POSTGRES_PASSWORD: cicekci
      POSTGRES_DB: cicekci
      TZ: Europe/Istanbul
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicekci"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicekci
      POSTGRES_PASSWORD: cicekci
      POSTGRES_DB: cicekci_test
      TZ: Europe/Istanbul
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicekci"]
      interval: 2s
      timeout: 3s
      retries: 15
